<style>
#seq1 svg { max-width: 100%; height: auto; }
</style>
<div id="seq1"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    actorBkg: dark ? '#085041' : '#E1F5EE',
    actorBorder: dark ? '#5DCAA5' : '#0F6E56',
    actorTextColor: dark ? '#9FE1CB' : '#04342C',
    signalColor: dark ? '#9c9a92' : '#73726c',
    signalTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('seq1-svg', `sequenceDiagram
  participant St as Student
  participant Sys as System
  participant DB as Firestore DB
  St->>Sys: Select event & submit registration
  Sys->>DB: Check seat availability
  DB-->>Sys: Availability status
  alt Seats available
    Sys->>DB: Save registration
    DB-->>Sys: Confirmation
    Sys-->>St: Registration confirmed
    Sys->>DB: Trigger notification
  else No seats left
    Sys-->>St: Show event full
  end`);
document.getElementById('seq1').innerHTML = svg;
</script>
