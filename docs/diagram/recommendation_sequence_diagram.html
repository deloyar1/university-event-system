<style>
#seq2 svg { max-width: 100%; height: auto; }
</style>
<div id="seq2"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    actorBkg: dark ? '#3C3489' : '#EEEDFE',
    actorBorder: dark ? '#7F77DD' : '#534AB7',
    actorTextColor: dark ? '#CECBF6' : '#26215C',
    signalColor: dark ? '#9c9a92' : '#73726c',
    signalTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('seq2-svg', `sequenceDiagram
  participant St as Student
  participant Sys as System
  participant Eng as Recommendation engine
  participant DB as Firestore DB
  St->>Sys: Open discovery page
  Sys->>DB: Fetch student interests
  DB-->>Sys: Interest profile
  Sys->>Eng: Request matching events
  Eng->>DB: Fetch event list
  DB-->>Eng: Events data
  Eng-->>Sys: Ranked events by matching score
  Sys-->>St: Show personalized recommendations`);
document.getElementById('seq2').innerHTML = svg;
</script>
